# ==============================================
# Production Configuration
# ==============================================

# Application
spring.application.name=bancom-api
server.port=${SERVER_PORT:8005}

# Datasource - H2 (cambiar a PostgreSQL/MySQL en producción real)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bancomdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:usrdemo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:demo}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging - Production Level
logging.level.root=WARN
logging.level.com.bancom.app.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator - Health check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Security
spring.security.filter.dispatcher-types=REQUEST,FORWARD,ERROR

# Server configuration
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
jwt.secret.key=${JWT_SECRET_KEY:my-default-secret-key-change-in-production-must-be-at-least-256-bits}
jwt.expiration.time=${JWT_EXPIRATION_TIME:3600000}
